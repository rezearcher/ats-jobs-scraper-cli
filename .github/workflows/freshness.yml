name: adapter-freshness

# Self-maintaining moat: every day this probes all seven ATS adapters against a
# large live canary board and checks the response is still reachable, populated,
# and schema-intact. When an upstream silently changes its JSON shape or moves an
# endpoint, the probe exits non-zero and this workflow opens (or updates) a single
# tracking issue — so breakage is caught here, before it reaches a real run, and
# the signal flows to a place a maintainer reads instead of a dead-end log.

on:
  schedule:
    - cron: '17 6 * * *' # daily 06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: adapter-freshness
  cancel-in-progress: false

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Probe adapters against live canaries
        id: probe
        run: node health-check.mjs

      - name: Upload health status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-status
          path: health-status.json
          if-no-files-found: ignore

      - name: Open or update drift issue
        if: failure() && steps.probe.conclusion == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let report = {};
            try { report = JSON.parse(fs.readFileSync('health-status.json', 'utf8')); } catch (_) {}
            const degraded = (report.degraded_platforms || []).join(', ') || 'unknown';
            const rows = (report.results || [])
              .map(r => `| ${r.platform} | ${r.verdict} | ${r.count ?? '-'} | ${r.detail || ''} |`)
              .join('\n');
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `Adapter freshness probe failed on **${report.generated_at || new Date().toISOString()}**.`,
              ``,
              `Degraded: **${degraded}**`,
              ``,
              `| platform | verdict | count | detail |`,
              `|---|---|---|---|`,
              rows,
              ``,
              `[Workflow run](${run})`,
            ].join('\n');

            const label = 'adapter-drift';
            // Ensure the label exists (ignore "already exists").
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner, repo: context.repo.repo,
                name: label, color: 'b60205',
                description: 'An ATS adapter failed its live freshness probe',
              });
            } catch (_) {}

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: label,
            });

            if (existing.data.length) {
              const num = existing.data[0].number;
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: num, body,
              });
              core.notice(`Updated existing drift issue #${num}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: `Adapter drift detected: ${degraded}`,
                body, labels: [label],
              });
              core.notice(`Opened drift issue #${created.data.number}`);
            }
